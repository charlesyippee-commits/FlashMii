name: Build FlashMii
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: FlashMii
          path: apps/FlashMii
